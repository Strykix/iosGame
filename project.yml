name: StarBarge
options:
  bundleIdPrefix: com.indie
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.10.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0

fileGroups:
  - StoreKit
  - README.md
  - project.yml

targets:
  StarBarge:
    type: application
    platform: iOS
    sources:
      - path: StarBarge
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    info:
      path: StarBarge/Info.plist
      properties:
        CFBundleDisplayName: "Don't Pop"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes: [instagram-stories]
        CFBundleURLTypes:
          - CFBundleURLName: com.indie.starbarge.challenge
            CFBundleURLSchemes: [starbarge]
        # AdMob — values come from the ADMOB_* build settings below (per configuration).
        GADApplicationIdentifier: "$(ADMOB_APP_ID)"
        AdMobRewardedUnitID: "$(ADMOB_REWARDED_UNIT_ID)"
        # Localized in Resources/*.lproj/InfoPlist.strings.
        NSUserTrackingUsageDescription: "Your data will be used to show you more relevant ads. The game stays free and ads stay optional."
        # Google's own network. For mediation / third-party buyers, paste the full list from
        # https://developers.google.com/admob/ios/privacy/strategies (SKAdNetwork section).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indie.starbarge
        PRODUCT_NAME: StarBarge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        # Google's public test IDs: safe to click, no revenue.
        Debug:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/1712485313
        # ⚠️ Replace with YOUR IDs from admob.google.com before shipping, then run `xcodegen generate`.
        Release:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_REWARDED_UNIT_ID: ca-app-pub-3940256099942544/1712485313

  StarBargeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StarBargeTests
    dependencies:
      - target: StarBarge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indie.starbarge.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StarBarge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StarBarge"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  StarBarge:
    build:
      targets:
        StarBarge: all
        StarBargeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Products.storekit
    test:
      config: Debug
      targets:
        - StarBargeTests
    archive:
      config: Release
